<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0b0d;--line:#20242c;--txt:#e8eaf0;--mut:#9aa3b2;--faint:#5c6473;--acc:#34d399;--acc2:#22d3ee}
  *{box-sizing:border-box;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{width:1200px;height:630px;background:var(--bg);overflow:hidden}
  .c{position:relative;width:1200px;height:630px;background:var(--bg);color:var(--txt);
    font-family:"Inter",system-ui,sans-serif;padding:58px 68px;display:flex;flex-direction:column}
  .glow{position:absolute;top:-160px;right:-120px;width:680px;height:520px;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(52,211,153,.20),rgba(34,211,238,.06) 55%,transparent 74%);filter:blur(6px)}
  .grid{position:absolute;inset:0;opacity:.35;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:48px 48px}
  .top,.bottom{position:relative;z-index:1}
  .tag{display:inline-flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.12em;
    color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:9px 18px;background:rgba(255,255,255,.02)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px 1px rgba(52,211,153,.7)}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:70px;letter-spacing:-.03em;line-height:1;margin:30px 0 0}
  .grad{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:38px;letter-spacing:-.02em;line-height:1.07;margin-top:12px;
    background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mut);font-size:19px;line-height:1.5;max-width:46ch;margin-top:20px}
  .bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    font-family:"JetBrains Mono",monospace;font-size:16px}
  .flow{color:var(--faint);display:flex;align-items:center;gap:13px}
  .flow b{color:var(--txt);font-weight:500}.flow .ar{color:var(--acc)}
  .url{color:var(--acc)}
</style></head><body>
<div class="c">
  <div class="grid"></div><div class="glow"></div>
  <div class="top">
    <div class="tag"><span class="dot"></span> Live on Arc · settled in USDC</div>
    <h1>Arc&nbsp;Pump</h1>
    <div class="grad">Pay-per-call payments<br>for AI agents.</div>
    <div class="sub">Agents pay per request in USDC on Arc — metered, capped, and settled on-chain. No subscriptions, no humans.</div>
  </div>
  <div class="bottom">
    <div class="flow"><b>402</b> <span class="ar">→</span> pay USDC on Arc <span class="ar">→</span> <b>200</b></div>
    <div class="url">arcpump.com/pay</div>
  </div>
</div>
</body></html>
