name = "tempo-pump-mpp"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Enable Workers Logs so console.error / .log show up in the dashboard
# and via `wrangler tail`. Free tier supports this.
[observability.logs]
enabled = true
invocation_logs = true

# Secrets set via: wrangler secret put DEPLOYER_KEY
# (don't commit private keys)

[vars]
FACTORY_ADDRESS = "0x42bce0940b286b29a7be50c3c7c89302a48e28ff"
PATHUSD_ADDRESS = "0x20C0000000000000000000000000000000000000"
# USDC.e — separate gas fee token so deployer can pay gas from its USDC.e
# balance while factory.createFee still pulls pathUSD.
GAS_FEE_TOKEN = "0x20C000000000000000000000b9537d11c60E8b50"

# DEPLOYER_ADDRESS = Claude's own wallet. A standalone EOA whose private key
# the worker holds (DEPLOYER_KEY secret) to sign every agent action without
# any human in the loop. Standard viem can't sign as the user's main wallet
# via an access key — that path needs a Tempo-native KeyAuthorization signed
# by passkey, which the worker has no access to.
DEPLOYER_ADDRESS = "0xe7013E5686b4C50B9D8e7FdB76F74baA08909494"
# USER_WALLET = the human's main Tempo wallet. Sweep actions periodically
# transfer the agent's accumulated earnings (creator fees, buy gains) here so
# the human's onchain history grows with Claude's activity.
USER_WALLET = "0xa8aB0DE5937BD22Da15F7FeE25F1340D7c83C935"
RPC_URL = "https://rpc.tempo.xyz"
PRICE_PATHUSD = "0.10"
# /launch-and-bootstrap charges more — server does createToken + approve + buy
# (3 tx) so cost is higher and the agent receives more value.
PRICE_LIFECYCLE_PATHUSD = "0.05"

# ============ Autonomous agent ============
# Cron triggers fire scheduled() handler every 6 hours. The handler picks a
# random action (launch / buy / claim / heartbeat) and records to KV.
[triggers]
crons = ["0 */6 * * *"]

[[kv_namespaces]]
binding = "AGENT_LOG"
id = "a5ebdb07177542e8981d70378de553b2"
