name = "tempo-pump-mpp"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Enable Workers Logs so console.error / .log show up in the dashboard
# and via `wrangler tail`. Free tier supports this.
[observability.logs]
enabled = true
invocation_logs = true

# Secrets set via: wrangler secret put DEPLOYER_KEY
# (don't commit private keys)

[vars]
FACTORY_ADDRESS = "0x42bce0940b286b29a7be50c3c7c89302a48e28ff"
PATHUSD_ADDRESS = "0x20C0000000000000000000000000000000000000"
# USDC.e — separate gas fee token so deployer can pay gas from its USDC.e
# balance while factory.createFee still pulls pathUSD.
GAS_FEE_TOKEN = "0x20C000000000000000000000b9537d11c60E8b50"
DEPLOYER_ADDRESS = "0xe7013E5686b4C50B9D8e7FdB76F74baA08909494"
RPC_URL = "https://rpc.tempo.xyz"
PRICE_PATHUSD = "0.10"
# /launch-and-bootstrap charges more — server does createToken + approve + buy
# (3 tx) so cost is higher and the agent receives more value.
PRICE_LIFECYCLE_PATHUSD = "0.05"
