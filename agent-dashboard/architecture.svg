<svg width="680" viewBox="0 0 680 446" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Inter Tight',system-ui,Arial,sans-serif">
<title>Arc Pump Agent architecture</title>
<desc>An autonomous loop: an AI agent reasons with Claude, signs through a Circle Programmable Wallet, settles a transaction in USDC on Arc smart contracts, and posts its reasoning to a live dashboard — repeating every six hours.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8a8f98"/></marker>
</defs>
<rect x="0" y="0" width="680" height="446" rx="14" fill="#FAFAF7"/>

<!-- header pill -->
<rect x="200" y="22" width="280" height="26" rx="13" fill="#F1F1EE" stroke="#dad9d0"/>
<text x="340" y="39" text-anchor="middle" font-size="12" fill="#6b6b6b">↻  Autonomous — runs every 6 hours</text>

<!-- loop-back arrow -->
<path d="M130,357 H92 V93 H130" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text transform="translate(66,254) rotate(-90)" text-anchor="middle" font-size="12" fill="#6b6b6b">next cycle</text>

<!-- B1 agent (blue) -->
<rect x="130" y="66" width="440" height="54" rx="8" fill="#E6F1FB" stroke="#2563EB"/>
<text x="350" y="90" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">AI Agent — reasons with Claude Opus 4.8</text>
<text x="350" y="108" text-anchor="middle" font-size="12" fill="#1d4ed8">reads Arc state · decides launch / buy / claim</text>

<line x1="350" y1="120" x2="350" y2="151" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="368" y="140" font-size="12" fill="#6b6b6b">signs the chosen action</text>

<!-- B2 circle wallet (teal) -->
<rect x="130" y="154" width="440" height="54" rx="8" fill="#D6F0EC" stroke="#0d9488"/>
<text x="350" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#134E48">Circle Programmable Wallet (MPC)</text>
<text x="350" y="196" text-anchor="middle" font-size="12" fill="#0f766e">signs as the agent's wallet on Arc — no private key held</text>

<line x1="350" y1="208" x2="350" y2="239" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="368" y="228" font-size="12" fill="#6b6b6b">executes the contract call</text>

<!-- B3 arc contracts (teal) -->
<rect x="130" y="242" width="440" height="54" rx="8" fill="#D6F0EC" stroke="#0d9488"/>
<text x="350" y="266" text-anchor="middle" font-size="14" font-weight="500" fill="#134E48">Arc smart contracts — Arc Pump</text>
<text x="350" y="284" text-anchor="middle" font-size="12" fill="#0f766e">MemeFactory + bonding curve · settled in USDC on Arc</text>

<line x1="350" y1="296" x2="350" y2="327" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="368" y="316" font-size="12" fill="#6b6b6b">posts reasoning + tx hash</text>

<!-- B4 dashboard (gray) -->
<rect x="130" y="330" width="440" height="54" rx="8" fill="#F1F1EE" stroke="#b9b8ae"/>
<text x="350" y="354" text-anchor="middle" font-size="14" font-weight="500" fill="#2a2a2a">Live dashboard</text>
<text x="350" y="372" text-anchor="middle" font-size="12" fill="#6b6b6b">Cloudflare Worker + KV · public reasoning + tx feed</text>

<!-- legend -->
<rect x="130" y="404" width="13" height="13" rx="3" fill="#E6F1FB" stroke="#2563EB"/>
<text x="149" y="414" font-size="12" fill="#6b6b6b">AI agent</text>
<rect x="250" y="404" width="13" height="13" rx="3" fill="#D6F0EC" stroke="#0d9488"/>
<text x="269" y="414" font-size="12" fill="#6b6b6b">Circle &amp; Arc</text>
<rect x="402" y="404" width="13" height="13" rx="3" fill="#F1F1EE" stroke="#b9b8ae"/>
<text x="421" y="414" font-size="12" fill="#6b6b6b">infrastructure</text>
</svg>
